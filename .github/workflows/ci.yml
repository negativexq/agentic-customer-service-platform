name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.16"
  NODE_VERSION: "22.14.0"

jobs:
  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install locked backend dependencies
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run --frozen ruff check .
      - name: Ruff format check
        run: uv run --frozen ruff format --check .
      - name: Mypy
        run: uv run --frozen mypy app tests evaluation scripts
      - name: Pytest
        run: uv run --frozen pytest
      - name: Deterministic capacity benchmark
        run: uv run --frozen python scripts/run_capacity_benchmark.py --iterations 20 --workers 4
      - name: Isolated persistence capacity benchmark
        run: uv run --frozen python scripts/benchmark_postgres_capacity.py --operations 100 --workers 8

  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Vitest
        run: npm test
      - name: Production build
        run: npm run build

  security:
    name: Security Checks
    needs: [backend-quality, frontend-quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install locked backend dependencies
        run: uv sync --frozen
      - name: Audit Python dependencies
        run: uv run --frozen pip-audit
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend
      - name: Audit frontend dependencies
        run: npm audit --prefix frontend --audit-level=high
      - name: Detect committed secrets
        run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:v8.27.2
          detect --source=/repo --redact --no-banner --log-opts="--all"
      - name: Scan repository vulnerabilities and misconfiguration
        run: >-
          docker run --rm -v "$PWD:/workspace" -v trivy-cache:/root/.cache/trivy
          aquasec/trivy:0.70.0
          fs --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL
          --scanners vuln,misconfig,secret --skip-version-check /workspace
      - name: Validate GitHub Actions workflow
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint:1.7.7 -color

  evaluation:
    name: Deterministic Evaluation
    needs: security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CHECKPOINT_BACKEND: memory
      RAG_BACKEND: local
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install locked backend dependencies
        run: uv sync --frozen
      - name: Full deterministic evaluation
        run: uv run --frozen python -m evaluation.runner
      - name: Safety evaluation
        run: uv run --frozen python -m evaluation.runner --safety
      - name: Resilience evaluation
        run: uv run --frozen python -m evaluation.runner --resilience
      - name: Validate external evidence tooling
        run: uv run --frozen python -m app.evidence.cli --help
      - name: Upload external evidence payloads when produced
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evaluation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/evidence-manifests/
            artifacts/evidence-payloads/
          if-no-files-found: warn
          retention-days: 14

  docker-validation:
    name: Docker Build and Scan
    needs: evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Validate optional metrics infrastructure model
        run: docker compose --profile metrics config --quiet
      - name: Validate pinned Collector metrics configuration
        run: >-
          docker compose --profile metrics run --rm --no-deps otel-collector
          validate --config=/etc/otelcol-contrib/metrics.yaml
      - name: Validate pinned Prometheus configuration
        run: >-
          docker compose --profile metrics run --rm --no-deps
          --entrypoint /bin/promtool prometheus
          check config /etc/prometheus/prometheus.yml
      - name: Scan pinned metrics infrastructure images
        run: |
          for metrics_image in $(docker compose --profile metrics config --images otel-collector prometheus); do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v trivy-cache:/root/.cache/trivy aquasec/trivy:0.70.0 \
              image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL \
              --scanners vuln --skip-version-check "$metrics_image"
          done
      - name: Validate integration Compose model
        run: >-
          LOCAL_DEMO_AUTH_TOKEN=integration-ci-credential
          LOCAL_DEMO_ACTOR_ID=e2e-support-operator
          docker compose -f docker-compose.yml -f docker-compose.integration.yml
          --env-file .env.example config --quiet
      - name: Validate production Compose model excludes integration provider
        env:
          POSTGRES_PASSWORD: validation-only
          DATABASE_URL: postgresql+psycopg://app:validation-only@db:5432/customer_service
          OIDC_ISSUER: https://identity.validation.invalid
          OIDC_AUDIENCE: agent-control-plane
          DEPLOYMENT_ID: github-actions-${{ github.run_id }}
          EVIDENCE_STORE_BACKEND: s3
          EVIDENCE_STORE_BUCKET: validation-evidence
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config > /tmp/production-compose.yml
          docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile metrics config --quiet
          if grep -q deterministic_integration /tmp/production-compose.yml; then
            echo "Integration-only LLM provider leaked into production Compose configuration."
            exit 1
          fi
      - name: Validate production topology policy
        run: uv run --frozen python scripts/validate_production_topology.py
      - name: Build backend image
        run: docker build --tag customer-service-backend:ci .
      - name: Build frontend image
        run: docker build --tag customer-service-frontend:ci frontend
      - name: Scan backend image
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          -v trivy-cache:/root/.cache/trivy
          aquasec/trivy:0.70.0
          image --exit-code 1 --ignore-unfixed --severity CRITICAL
          --skip-version-check customer-service-backend:ci
      - name: Scan frontend image
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          -v trivy-cache:/root/.cache/trivy
          aquasec/trivy:0.70.0
          image --exit-code 1 --ignore-unfixed --severity CRITICAL
          --skip-version-check customer-service-frontend:ci

  operator-e2e:
    name: Frontend E2E
    needs: docker-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend
      - name: Install Chromium
        run: npx --prefix frontend playwright install --with-deps chromium
      - name: Run deterministic operator journeys
        env:
          OPERATOR_E2E_PROJECT_NAME: operator-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          E2E_CAPTURE_SCREENSHOTS: "1"
        run: bash scripts/run_operator_e2e.sh
      - name: Upload bounded journey evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: operator-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            screenshots/operator-e2e/
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 14

  metrics-delivery:
    name: Application Metrics Delivery
    needs: docker-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      T4D_COMPOSE_PROJECT_NAME: t4d-metrics-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify domain/native delivery, privacy, and Collector recovery
        run: python3 -m scripts.otel_metrics_delivery_smoke
      - name: Remove isolated metrics stack and volumes
        if: always()
        run: >-
          docker compose --project-name "$T4D_COMPOSE_PROJECT_NAME"
          --file docker-compose.yml --file docker-compose.integration.yml
          --env-file .env.example --profile metrics
          down --volumes --remove-orphans --timeout 20

  telemetry-runtime:
    name: Telemetry Runtime Acceptance
    # Independent diagnostic pass; restore metrics-delivery before acceptance.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Diagnostic pass only; restore the full matrix before acceptance.
        scenario: [disabled]
        probe: [1, 2, 3]
    env:
      T5_COMPOSE_PROJECT_NAME: t4d-metrics-t5-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.scenario }}-${{ matrix.probe }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify real SIGTERM final delivery and failure isolation
        run: >-
          python3 -m scripts.otel_runtime_smoke
          --project "$T5_COMPOSE_PROJECT_NAME" --scenario "${{ matrix.scenario }}"
      - name: Remove isolated runtime stack and volumes
        if: always()
        run: >-
          docker compose --project-name "$T5_COMPOSE_PROJECT_NAME"
          --file docker-compose.yml --file docker-compose.integration.yml
          --env-file .env.example --profile metrics
          down --volumes --remove-orphans --timeout 20

  integration-smoke:
    name: Authenticated Full-Stack Lifecycle Smoke
    needs: docker-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      E2E_COMPOSE_PROJECT_NAME: customer-service-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_DEMO_AUTH_TOKEN: integration-ci-credential
      LOCAL_DEMO_AUTH_TOKEN: integration-ci-credential
      LOCAL_DEMO_ACTOR_ID: e2e-support-operator
      BACKEND_PORT: "0"
      FRONTEND_PORT: "0"
      POSTGRES_PORT: "0"
      QDRANT_HTTP_PORT: "0"
      QDRANT_GRPC_PORT: "0"
      JAEGER_UI_PORT: "0"
      OTEL_GRPC_PORT: "0"
      OTEL_HTTP_PORT: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run authenticated agent lifecycle smoke
        run: python3 scripts/e2e_authenticated_smoke.py --leave-on-failure
      - name: Collect bounded redacted container logs
        if: failure()
        run: |
          docker compose --project-name "$E2E_COMPOSE_PROJECT_NAME" \
            --file docker-compose.yml --file docker-compose.integration.yml \
            --env-file .env.example ps --all
          docker compose --project-name "$E2E_COMPOSE_PROJECT_NAME" \
            --file docker-compose.yml --file docker-compose.integration.yml \
            --env-file .env.example logs --no-color --tail 200 \
            | sed "s/${LOCAL_DEMO_AUTH_TOKEN}/[REDACTED]/g"
      - name: Remove isolated integration stack and volumes
        if: always()
        run: >-
          docker compose --project-name "$E2E_COMPOSE_PROJECT_NAME"
          --file docker-compose.yml --file docker-compose.integration.yml
          --env-file .env.example down --volumes --remove-orphans --timeout 20
