# Metrics only. The application exporter remains the privacy boundary.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 4
        max_concurrent_streams: 16

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 48
  transform/metric_resource:
    error_mode: propagate
    metric_statements:
      - context: resource
        statements:
          - delete_matching_keys(attributes, ".*")
  batch:
    timeout: 1s
    send_batch_size: 512
    send_batch_max_size: 1024

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    translation_strategy: UnderscoreEscapingWithSuffixes
    without_scope_info: true
    resource_constant_labels:
      excluded: ["*"]
    enable_open_metrics: false
    send_timestamps: false
    metric_expiration: 5m
    sending_queue:
      enabled: false

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: error
    metrics:
      level: none
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, transform/metric_resource, batch]
      exporters: [prometheus]
