services:
  db:
    ports: !reset []
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    read_only: true
    tmpfs:
      - /run/postgresql:size=16m,mode=1777
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-customer_service}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    deploy:
      resources:
        limits:
          cpus: ${POSTGRES_CPU_LIMIT:-1.0}
          memory: ${POSTGRES_MEMORY_LIMIT:-1G}

  demo-setup:
    environment:
      APP_ENV: production
      LANGGRAPH_STRICT_MSGPACK: "true"
      LLM_PROVIDER: openai_compatible
      AGENT_DECISION_CONTRACT_VERSION: semantic_decision_v3
      LLM_STRUCTURED_OUTPUT_MODE: ${LLM_STRUCTURED_OUTPUT_MODE:-schema}
      AUTH_MODE: oidc
      OIDC_ISSUER: ${OIDC_ISSUER:?OIDC_ISSUER must be set}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?OIDC_AUDIENCE must be set}
      LOCAL_DEMO_AUTH_TOKEN: ""
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      CHECKPOINT_BACKEND: postgres
      POLICY_AUDIT_BACKEND: postgres
      AGENT_RUN_PROJECTION_BACKEND: postgres
    command: ["alembic", "upgrade", "head"]

  backend:
    ports: !reset []
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      APP_ENV: production
      LANGGRAPH_STRICT_MSGPACK: "true"
      LLM_PROVIDER: openai_compatible
      AGENT_DECISION_CONTRACT_VERSION: semantic_decision_v3
      LLM_STRUCTURED_OUTPUT_MODE: ${LLM_STRUCTURED_OUTPUT_MODE:-schema}
      AUTH_MODE: oidc
      OIDC_ISSUER: ${OIDC_ISSUER:?OIDC_ISSUER must be set}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?OIDC_AUDIENCE must be set}
      LOCAL_DEMO_AUTH_TOKEN: ""
      DEBUG: "false"
      SERVICE_VERSION: ${SERVICE_VERSION:-0.1.0}
      DEPLOYMENT_ID: ${DEPLOYMENT_ID:?DEPLOYMENT_ID must be set}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      CHECKPOINT_BACKEND: postgres
      POLICY_AUDIT_BACKEND: postgres
      AGENT_RUN_PROJECTION_BACKEND: postgres
      EVIDENCE_STORE_BACKEND: ${EVIDENCE_STORE_BACKEND:?EVIDENCE_STORE_BACKEND must be set}
      EVIDENCE_STORE_BUCKET: ${EVIDENCE_STORE_BUCKET:?EVIDENCE_STORE_BUCKET must be set}
    depends_on:
      jaeger:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: ${BACKEND_CPU_LIMIT:-1.0}
          memory: ${BACKEND_MEMORY_LIMIT:-1G}

  frontend:
    build:
      args:
        LOCAL_DEMO_AUTH_TOKEN: ""
        FRONTEND_AUTH_MODE: external_session
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: ${FRONTEND_CPU_LIMIT:-0.5}
          memory: ${FRONTEND_MEMORY_LIMIT:-256M}

  qdrant:
    ports: !reset []
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: ${QDRANT_CPU_LIMIT:-1.0}
          memory: ${QDRANT_MEMORY_LIMIT:-1G}

  jaeger:
    ports: !reset []
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:14269/"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits:
          cpus: ${JAEGER_CPU_LIMIT:-0.5}
          memory: ${JAEGER_MEMORY_LIMIT:-512M}

  otel-collector:
    ports: !reset []
