services:
  db:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: customer_service
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d customer_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  demo-setup:
    build: .
    environment: &backend-environment
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/customer_service
      APP_ENV: development
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compatible}
      AUTH_MODE: local_demo
      LOCAL_DEMO_AUTH_TOKEN: ${LOCAL_DEMO_AUTH_TOKEN:-local-demo-support-token}
      LOCAL_DEMO_ACTOR_ID: ${LOCAL_DEMO_ACTOR_ID:-operator-local-demo}
      LANGGRAPH_STRICT_MSGPACK: ${LANGGRAPH_STRICT_MSGPACK:-true}
      LLM_MODEL: ${LLM_MODEL:-llama3.1}
      LLM_BASE_URL: ${COMPOSE_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
      LLM_STRUCTURED_OUTPUT_MODE: ${LLM_STRUCTURED_OUTPUT_MODE:-schema}
      AGENT_DECISION_CONTRACT_VERSION: ${AGENT_DECISION_CONTRACT_VERSION:-semantic_decision_v3}
      LLM_CONNECT_TIMEOUT_SECONDS: ${LLM_CONNECT_TIMEOUT_SECONDS:-5.0}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30.0}
      EMBEDDING_CONNECT_TIMEOUT_SECONDS: ${EMBEDDING_CONNECT_TIMEOUT_SECONDS:-5.0}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30.0}
      RETRIEVAL_TIMEOUT_SECONDS: ${RETRIEVAL_TIMEOUT_SECONDS:-5.0}
      RAG_RERANKER_TIMEOUT_SECONDS: ${RAG_RERANKER_TIMEOUT_SECONDS:-3.0}
      QDRANT_TIMEOUT_SECONDS: ${QDRANT_TIMEOUT_SECONDS:-10.0}
      POLICY_AUDIT_BACKEND: ${POLICY_AUDIT_BACKEND:-postgres}
      POLICY_AUDIT_QUERY_LIMIT: ${POLICY_AUDIT_QUERY_LIMIT:-50}
      AGENT_RUN_PROJECTION_BACKEND: ${AGENT_RUN_PROJECTION_BACKEND:-postgres}
      AGENT_RUN_PROJECTION_QUERY_LIMIT: ${AGENT_RUN_PROJECTION_QUERY_LIMIT:-50}
      QDRANT_URL: http://qdrant:6333
      QDRANT_SCHEMA_VERSION: ${QDRANT_SCHEMA_VERSION:-2}
      QDRANT_CHUNKING_VERSION: ${QDRANT_CHUNKING_VERSION:-1}
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    command:
      ["sh", "-c", "alembic upgrade head && python -m scripts.seed && python -m scripts.rag_ingest"]

  backend:
    build: .
    init: true
    stop_grace_period: 35s
    environment:
      <<: *backend-environment
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: agentic-customer-service-platform
      OTEL_METRICS_ENABLED: ${OTEL_METRICS_ENABLED:-false}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${COMPOSE_OTEL_METRICS_ENDPOINT:-http://otel-collector:4317}
      OTEL_METRIC_EXPORT_INTERVAL_MILLIS: ${OTEL_METRIC_EXPORT_INTERVAL_MILLIS:-15000}
      OTEL_METRIC_EXPORT_TIMEOUT_MILLIS: ${OTEL_METRIC_EXPORT_TIMEOUT_MILLIS:-5000}
      WEB_CONCURRENCY: "1"
    networks:
      - default
      - metrics
    deploy:
      replicas: 1
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      demo-setup:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--timeout-keep-alive",
        "5",
        "--timeout-graceful-shutdown",
        "30",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 20

  frontend:
    build:
      context: ./frontend
      args:
        LOCAL_DEMO_AUTH_TOKEN: ${LOCAL_DEMO_AUTH_TOKEN:-local-demo-support-token}
        FRONTEND_AUTH_MODE: ${FRONTEND_AUTH_MODE:-local_demo}
    init: true
    stop_grace_period: 10s
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:v1.19.0@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/6333; printf 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '^HTTP/1.1 200' <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.62.0@sha256:836e9b69c88afbedf7683ea7162e179de63b1f981662e83f5ebb68badadc710f
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    profiles: [metrics]
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: ["--config=/etc/otelcol-contrib/metrics.yaml"]
    environment:
      GOMEMLIMIT: 192MiB
    volumes:
      - ./config/observability/collector-metrics.yaml:/etc/otelcol-contrib/metrics.yaml:ro
    networks: [metrics]
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    profiles: [metrics]
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    read_only: true
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
      - --web.listen-address=0.0.0.0:9090
    volumes:
      - ./config/observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks: [metrics, metrics-ui]
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

volumes:
  postgres_data:
  qdrant_data:
  prometheus_data:

networks:
  metrics:
    internal: true
  metrics-ui:
