[project]
name = "agentic-customer-service-platform"
version = "0.1.0"
description = "Foundation for an enterprise-style agentic customer service platform."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13,<2.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "langchain-openai>=0.3,<2.0",
    "langgraph>=0.2,<2.0",
    "langgraph-checkpoint-postgres>=3.0,<4.0",
    "opentelemetry-api>=1.27,<2.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0,<1.0",
    "opentelemetry-sdk>=1.27,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "pyjwt[crypto]>=2.10,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "qdrant-client>=1.12,<2.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "scripts*", "evaluation*"]

[tool.setuptools.package-data]
app = ["agent/prompts/*.txt", "knowledge/*.md"]

[dependency-groups]
dev = [
    "mypy>=1.13,<2.0",
    "pip-audit>=2.9,<3.0",
    "pytest>=9.0.3,<10.0",
    "ruff>=0.8,<1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "alembic/versions", "frontend/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
required-version = "==0.11.16"
